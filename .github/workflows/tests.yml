name: Desafio - CLI e pgVector

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar sintaxe e Compose
        run: |
          python -m compileall -q src tests
          docker compose config --quiet
      - name: Subir banco e habilitar pgVector
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres
          docker compose run --rm bootstrap_vector_ext
      - name: Testar CLI, ingestão e busca com PostgreSQL real
        env:
          RUN_DB_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Verificar os comandos obrigatórios e erro de configuração
        run: |
          python src/ingest.py --help
          python src/search.py --help
          printf 'sair\n' | python src/chat.py
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar ambiente de testes
        if: always()
        run: docker compose down -v
